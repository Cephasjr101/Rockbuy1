# fly.toml app configuration file generated for rockbuy1 on 2026-11-08T00:28:21Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rockbuy1'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[[mounts]]
  source = 'shopdata'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
